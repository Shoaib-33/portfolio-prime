# Render blueprint (free plan, Frankfurt / EU):
# - one web service running the website (Next.js) and the API (FastAPI, Python) together (start.js)
# - one free PostgreSQL database; data and uploaded files are stored there, so they survive restarts.
# Free web services sleep after ~15 minutes idle (first visit then takes up to a minute).
# Render's free PostgreSQL databases expire after a limited period; check the Render dashboard.
databases:
  - name: portfolio-prime-db
    plan: free
    region: frankfurt
    databaseName: portfolio_prime
    user: portfolio_prime

services:
  - type: web
    name: portfolio-prime
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node start.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-prime-db
          property: connectionString
      - key: PP_SECRET
        generateValue: true
      - key: PP_DEMO
        value: "1"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
