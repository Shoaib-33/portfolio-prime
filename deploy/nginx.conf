# Maasland & Partners: public web server in front of the app (which listens on 127.0.0.1:3000 only).
# __DOMAIN__ is filled in by setup.sh; certbot adds the https part. It is also the default site, so the IP address works for testing.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__ www.__DOMAIN__;

    client_max_body_size 30m;   # Excel imports and documents (the app allows 25 MB)

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;   # AI analyst answers can take up to 45 seconds
    }
}
